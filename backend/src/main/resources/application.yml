server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: smart-care-community
  config:
    import: optional:classpath:application-local.yml
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 200MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/smart_care_community?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*Mapper.xml
  type-aliases-package: com.smartcare.**.domain
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

smartcare:
  jwt:
    secret: smart-care-community-jwt-secret-key-2026
    expire-minutes: 120
  msg-recall-minutes: 2
  file:
    upload-path: ./upload

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

knife4j:
  enable: true
  setting:
    language: zh_cn

ai:
  zhipu:
    api-key: ${ZHIPU_API_KEY:}
    api-url: https://open.bigmodel.cn/api/paas/v4/chat/completions
    text-model: glm-4-plus
    vision-model: glm-4v
    extract-model: glm-4-flash
    enabled: true
    max-tokens: 1000
    extract-max-tokens: 512
    temperature: 0.3
    extract-temperature: 0.1
